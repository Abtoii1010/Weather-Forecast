<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Checker</title>
    <link href="index.css" rel="stylesheet" />
  </head>
  <body>
    <h1 class="H1">Weather Forecast</h1>
    <form id="from">
      <input type="text" placeholder="Enter A City" id="inp" />
      <button type="submit" id="btn">Submit</button>
    </form>
    <div id="result">
      <h1 id="city"></h1>
      <p id="Temp"></p>
      <p id="Humid"></p>
      <p id="Type"></p>
    </div>
    <script src="index.js"></script>
  </body>
</html>
